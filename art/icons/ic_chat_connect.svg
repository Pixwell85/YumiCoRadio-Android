<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Connect: a bolt. Bold and flat, because at 32px nothing else survives.
       Thinner outline than the first pass, which was heavy enough to eat the fill. -->
  <path d="M20 2 L7 18 L14 18 L11 30 L25 13 L17 13 Z"
        fill="#000000" opacity="0.28" transform="translate(1.5,1.5)"/>
  <path d="M20 2 L7 18 L14 18 L11 30 L25 13 L17 13 Z"
        fill="#FFE100" stroke="#000000" stroke-width="1.2" stroke-linejoin="miter"/>
  <!-- A single flat highlight along the leading edge. One tone, no gradient. -->
  <path d="M19 4 L9.5 17 L12.5 17 L19 6.5 Z" fill="#FFF489"/>
</svg>
